# Временный запуск: скриншоты работ команды для страниц /team. Ветка удаляется после использования.
name: work-screenshots
on:
  push:
    branches: [tmp/work-screenshots]
permissions:
  contents: write
jobs:
  shots:
    if: "!contains(github.event.head_commit.message, '[shots]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Screenshots
        run: |
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const sites = { aslam: "https://neweratrading.netlify.app/", behruz: "https://profound-druid-f5a1ef.netlify.app/" };
          const browser = await chromium.launch();
          for (const [id, url] of Object.entries(sites)) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 2 });
            await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });
            await page.waitForTimeout(3000);
            await page.screenshot({ path: `${id}.png` });
            console.log(id, await page.title());
          }
          await browser.close();
          JS
          node shot.mjs
      - name: Commit screenshots to this branch
        run: |
          mkdir -p tmp-shots && mv aslam.png behruz.png tmp-shots/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add tmp-shots && git commit -m "[shots] team work screenshots" && git push
